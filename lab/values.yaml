# Helm-Values für das Lab (scripts/lab.sh up). Kein Produktionsbeispiel: siehe docs/lab.md.
image: {repository: ordivus, tag: dev, pullPolicy: IfNotPresent}
configuration: {source: configMap, name: ordivus-lab-config}
policy: {configMap: ordivus-lab-policy}
credentials:
  readOnly: {secret: {secretName: lab-openbao-token-readonly}}
  apply: {secret: {secretName: lab-openbao-token-apply}}
# Die Config ist bis auf die OpenBao-Rolle für alle Modi gleich: auth.yaml pro Modus über extraConfigSources.
jobs:
  templates:
    plan: &readonly
      projectedToken: {enabled: true, audience: openbao}
      extraConfigSources: [{configMap: {name: ordivus-lab-auth-readonly}}]
      extraVolumes: [{name: openbao-ca, configMap: {name: openbao-ca}}]
      extraVolumeMounts: [{name: openbao-ca, mountPath: /etc/ordivus-lab, readOnly: true}]
    drift: *readonly
    apply:
      projectedToken: {enabled: true, audience: openbao}
      extraConfigSources: [{configMap: {name: ordivus-lab-auth-apply}}]
      extraVolumes: [{name: openbao-ca, configMap: {name: openbao-ca}}]
      extraVolumeMounts: [{name: openbao-ca, mountPath: /etc/ordivus-lab, readOnly: true}]
