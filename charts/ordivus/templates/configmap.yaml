{{- if eq .Values.configuration.source "inline" }}
{{- range $ns := include "ordivus.namespaces" . | fromJsonArray }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-configuration" $.Release.Name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "ordivus.labels" $ | nindent 4 }}
data:
  {{- required "configuration.files must not be empty for configuration.source=inline" $.Values.configuration.files | toYaml | nindent 2 }}
{{- end }}
{{- end }}
