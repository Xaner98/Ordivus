{{- include "ordivus.validate" . }}
{{- $v := .Values -}}
{{- range $mode := list "plan" "drift" "apply" }}
{{- $t := index $v.jobs.templates $mode }}
{{- if $t.enabled }}
---
{{ include "ordivus.cronJob" (dict "root" $ "name" $mode "mode" $mode "t" $t "suspend" $t.suspended) }}
{{- end }}
{{- end }}
{{- if $v.jobs.scheduledDrift.enabled }}
---
{{ include "ordivus.cronJob" (dict "root" $ "name" "drift-scheduled" "mode" "drift" "t" $v.jobs.scheduledDrift "suspend" false) }}
{{- end }}
