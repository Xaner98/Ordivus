{{- $np := .Values.security.networkPolicy }}
{{- if $np.enabled }}
{{- range $ns := include "ordivus.namespaces" . | fromJsonArray }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "ordivus.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ordivus
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $np.dns.namespace | quote }}}
          podSelector:
            matchLabels: {{- toYaml ($np.dns.podSelector | default dict) | nindent 14 }}
        {{- range $np.dns.cidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range $np.egress }}
    - to:
        - {{ include "ordivus.ipBlock" . | indent 10 | trim }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - {protocol: TCP, port: {{ . | int }}}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
