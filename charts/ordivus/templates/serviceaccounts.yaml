{{- if .Values.security.createServiceAccounts }}
{{- range $name := uniq (list .Values.security.readOnlyServiceAccount .Values.security.applyServiceAccount) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ordivus.labels" $ | nindent 4 }}
  {{- with $.Values.security.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Token nur über die Pod-Spec (automountServiceAccountToken / projectedToken).
automountServiceAccountToken: false
{{- end }}
{{- end }}
