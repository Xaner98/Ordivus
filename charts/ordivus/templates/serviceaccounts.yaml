{{- if .Values.security.createServiceAccounts }}
{{- range $sa := list (list .Values.security.readOnlyServiceAccount .Release.Namespace) (list .Values.security.applyServiceAccount (include "ordivus.applyNamespace" .)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index $sa 0 | quote }}
  namespace: {{ index $sa 1 | quote }}
  labels:
    {{- include "ordivus.labels" $ | nindent 4 }}
  {{- with $.Values.security.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Token nur über die Pod-Spec (automountServiceAccountToken / projectedToken).
automountServiceAccountToken: false
{{- end }}
{{- end }}
