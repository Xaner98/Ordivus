# Ordivus Helm chart. Docs: docs/kubernetes.md

image:
  repository: ghcr.io/EXAMPLE/ordivus
  tag: ""          # default: appVersion
  digest: ""       # "sha256:<64 hex>" takes precedence over tag (recommended, required in profile hardened)
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Ordivus configuration, read-only under /config.
configuration:
  source: configMap                 # configMap: existing ConfigMap; inline: the chart creates it from files
  name: ordivus-configuration       # only with source=configMap
  files: {}                         # only with source=inline: file name -> content (YAML string)

# Operator policy, separate from the configuration, read-only under /policy.
# --policy is only passed if configMap or secret is set.
policy:
  configMap: ""
  secret: ""
  key: policy.yaml

# Credentials directory (for CredentialProvider type=file), always mounted read-only.
# Volume source separate per mode, so that plan/drift never see apply credentials.
# If apply should write new secrets with the file provider: use the OpenBao provider or explicitly mount a
# writable volume via jobs.templates.apply.extraVolumes/extraVolumeMounts.
credentials:
  mountPath: /var/run/secrets/ordivus
  readOnly: {}   # plan/drift, e.g. {secret: {secretName: ordivus-readonly-credentials}}
  apply: {}      # apply,      e.g. {secret: {secretName: ordivus-apply-credentials}}

jobs:
  # Suspended templates; start via kubectl create job --from=cronjob/<release>-<mode> (scripts/run-job.sh).
  templates:
    plan: &template
      enabled: true
      suspended: true
      schedule: "0 0 1 1 *"         # required field, no effect while suspended
      automountServiceAccountToken: false
      # Projected, audience-bound SA token, e.g. for OpenBao Kubernetes auth.
      projectedToken:
        enabled: false
        audience: openbao
        expirationSeconds: 600
        mountPath: /var/run/secrets/tokens
      extraArgs: []
      # Separate per mode, so that apply secrets never end up in plan/drift.
      env: []
      extraVolumes: []
      extraVolumeMounts: []
    drift: *template
    apply:
      <<: *template
      # Separate namespace for the apply CronJob, apply ServiceAccount and apply credentials
      # (default: release namespace). See docs/kubernetes.md, section Security.
      namespace: ""
      # suspended: false is only accepted with allowSchedule: true (never in profile hardened).
      allowSchedule: false
  # Optional, NOT suspended drift CronJob with a schedule.
  scheduledDrift:
    enabled: false
    schedule: "0 2 * * *"
    automountServiceAccountToken: false
    projectedToken:
      enabled: false
      audience: openbao
      expirationSeconds: 600
      mountPath: /var/run/secrets/tokens
    extraArgs: []
    env: []
    extraVolumes: []
    extraVolumeMounts: []

security:
  # development | standard | hardened (hardened enforces, among others, digest, policy, networkPolicy and
  # a separate apply namespace or admission.enabled; list in docs/kubernetes.md)
  profile: standard
  createServiceAccounts: true
  readOnlyServiceAccount: ordivus-readonly   # plan, drift, scheduledDrift
  applyServiceAccount: ordivus-apply         # apply; must differ from the readOnly name
  serviceAccountAnnotations: {}
  networkPolicy:
    enabled: false
    dns:
      # DNS only to these pods (port 53 UDP/TCP).
      namespace: kube-system
      podSelector: {k8s-app: kube-dns}
      # Additional DNS destinations by IP, e.g. NodeLocal DNSCache: [169.254.20.10/32]
      cidrs: []
    # Allowed egress in addition to DNS. Without except, the cloud metadata address
    # (169.254.169.254/32 or fd00:ec2::254/128) is excluded if it lies within the block.
    egress: []
    #  - cidr: 10.20.0.0/16
    #    ports: [5432, 8200]
    #    except: []                 # optional, replaces the default exclusions

# Optional ValidatingAdmissionPolicy (Kubernetes >= 1.30): pods with the apply ServiceAccount in the
# apply namespace only if they match the apply template. Limitations: docs/kubernetes.md.
admission:
  enabled: false

execution:
  timeoutSeconds: 1800              # activeDeadlineSeconds
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  terminationGracePeriodSeconds: 30

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 512Mi, ephemeral-storage: 256Mi}

nodeSelector: {}
tolerations: []
affinity: {}
