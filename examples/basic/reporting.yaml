apiVersion: ordivus.dev/v1alpha1
kind: Credential
metadata:
  name: reporting-password
spec:
  providerRef: central-openbao
  path: tenants/acme/reporting
  field: password
  lifecycle:
    createIfAbsent: true
    preserveExisting: true
    rotate: false
    generator:
      length: 40
      alphabet: alphanumeric-symbol-safe
---
apiVersion: ordivus.dev/v1alpha1
kind: DatabaseUser
metadata:
  name: reporting-reader
spec:
  targetRef: analytics-postgres
  identity:
    username: reporting_reader
  credentials:
    credentialRef: reporting-password
    passwordPolicy: verify
  roles:
    - reporting_readonly
  settings:
    login: true
  adapterOptions:
    postgresql:
      connectionLimit: 10
