[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivus"
version = "0.1.0"
description = "Stateless, declarative reconciliation engine for administrative configuration."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]
mysql = ["PyMySQL>=1.1,<2"]
redis = ["redis>=5.0,<9"]
mariadb = ["PyMySQL>=1.1,<2"]
mongodb = ["pymongo>=4.10,<5"]
kafka = ["kafka-python>=3.0,<4"]
# clickhouse, arcadedb, openbao, rabbitmq, keycloak, grafana: HTTP via standard library, no extra needed
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
ordivus = "ordivus.cli:main"

# Adapter-Plugins (§9.6); externe Pakete registrieren sich in derselben Gruppe.
[project.entry-points."ordivus.adapters"]
fake = "ordivus.adapters.fake:FakeAdapter"
postgresql = "ordivus.adapters.postgresql:PostgreSQLAdapter"
mysql = "ordivus.adapters.mysql:MySQLAdapter"
clickhouse = "ordivus.adapters.clickhouse:ClickHouseAdapter"
arcadedb = "ordivus.adapters.arcadedb:ArcadeDBAdapter"
redis = "ordivus.adapters.redis:RedisAdapter"
openbao = "ordivus.adapters.openbao:OpenBaoAdapter"
mariadb = "ordivus.adapters.mariadb:MariaDBAdapter"
mongodb = "ordivus.adapters.mongodb:MongoDBAdapter"
rabbitmq = "ordivus.adapters.rabbitmq:RabbitMQAdapter"
keycloak = "ordivus.adapters.keycloak:KeycloakAdapter"
kafka = "ordivus.adapters.kafka:KafkaAdapter"
grafana = "ordivus.adapters.grafana:GrafanaAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
